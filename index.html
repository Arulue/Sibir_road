<style>
/* Layout: одна колонка; дорога-пунктир петляет вниз, машина едет по ней при прокрутке */
:root {
  --bg: #D9E6C3;        /* луга и леса */
  --fg: #1E3125;
  --muted: #4F6352;
  --card: #FFFFFF;
  --line: #C2D1AE;
  --band: #A7AB9F;      /* асфальт */
  --road-dash: #FFFFFF; /* разметка дороги */
  --dash: #2A3F3A;      /* разметка */
  --accent: #D62828;    /* красная машина */
  --on-accent: #FFFFFF;
  --tree: #2F6B45; --tree2: #5E9A4A; --trunk: #7A5A3C; --grass-dark: #C6D9A8;
  --water: #8EC3DE;     /* Байкал */
  --water-edge: #3F86AE;
  --ice: #FFFFFF;
  --nerpa: #7D8A93; --nerpa-light: #B8C1C7; --nerpa-eye: #1B262C;
  --water-deep: #2C72A3; --shore: #E4DCC6; --mount: #AFC0BC; --land: #CDBF99;
  --salt: #FFFFFF; --salt-edge: #D3DBDC;   /* Бурсоль */
  --pink: #EE9DB1; --pink-deep: #D06A8A;
  --turq: #2FC4C4; --turq-ring: #A9EFE9;   /* Гейзерное */
  --pine: #2F5E4E; --birch: #E5B630;
  --snow: #FFFFFF; --rock: #9AA3A6; --rock-dark: #6E6A62; --meadow: #8DB86B; --concrete: #DADDD8; --granite: #B9876A;
  --mars: #D9744A; --mars-light: #EDB07F; --mars-dark: #B04E36;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131E17; --fg: #E3ECE2; --muted: #98AA99; --card: #1B2920; --line: #2B3D30;
    --band: #3A413B; --road-dash: #D6DCCF; --dash: #C6D4D0; --accent: #E8413A; --on-accent: #FFFFFF;
    --tree: #2C573A; --tree2: #3E6B37; --trunk: #4E3B2A; --grass-dark: #1A2A1F;
    --water: #1D4A62; --water-edge: #4C93BB; --ice: #BFE3F2;
  --nerpa: #9AA6AE; --nerpa-light: #C9D0D4; --nerpa-eye: #1B262C;
    --water-deep: #0F3249; --shore: #2E3B37; --mount: #34494A; --land: #6A6248;
    --salt: #D5DCDD; --salt-edge: #7E8C8F; --pink: #C86F88; --pink-deep: #9A4762;
    --turq: #1E9C9F; --turq-ring: #82DBD4; --pine: #5E9A85; --birch: #C99A22;
    --snow: #DCE6EA; --rock: #5C686F; --rock-dark: #3E3A35; --meadow: #4E7A45; --concrete: #8E938F; --granite: #8A5F4A; --mars: #A9573A; --mars-light: #C98760; --mars-dark: #84392A;
    color-scheme: dark;
  }
}

  --bg: #131E17; --fg: #E3ECE2; --muted: #98AA99; --card: #1B2920; --line: #2B3D30;
  --band: #3A413B; --road-dash: #D6DCCF; --dash: #C6D4D0; --accent: #E8413A; --on-accent: #FFFFFF;
    --tree: #2C573A; --tree2: #3E6B37; --trunk: #4E3B2A; --grass-dark: #1A2A1F;
  --water: #1D4A62; --water-edge: #4C93BB; --ice: #BFE3F2;
  --nerpa: #9AA6AE; --nerpa-light: #C9D0D4; --nerpa-eye: #1B262C;
  --water-deep: #0F3249; --shore: #2E3B37; --mount: #34494A; --land: #6A6248;
  --salt: #D5DCDD; --salt-edge: #7E8C8F; --pink: #C86F88; --pink-deep: #9A4762;
  --turq: #1E9C9F; --turq-ring: #82DBD4; --pine: #5E9A85; --birch: #C99A22;
  --snow: #DCE6EA; --rock: #5C686F; --rock-dark: #3E3A35; --meadow: #4E7A45; --concrete: #8E938F; --granite: #8A5F4A; --mars: #A9573A; --mars-light: #C98760; --mars-dark: #84392A;

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; overflow-x: hidden; }

.hero { max-width: 640px; margin: 0 auto; padding-block: 64px 48px; text-align: center; position: relative; z-index: 4; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 7vw, 60px); line-height: 1.05; margin: 0 0 16px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 auto; max-width: 46ch; text-wrap: pretty; }
.hint { margin-top: 20px; font-size: 13px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.hint span { display: inline-block; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }

.road { position: relative; max-width: 860px; margin: 0 auto; }
.road svg.map { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.band { fill: none; stroke: var(--band); stroke-width: 44; stroke-linecap: round; }
.dash { fill: none; stroke: var(--road-dash); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 16 12; }
.tree { fill: var(--tree); } .tree2 { fill: var(--tree2); } .trunk { fill: var(--trunk); } .glade { fill: var(--grass-dark); }
.lake { fill: url(#lakeGrad); stroke: var(--water-edge); stroke-width: 1.5; }
.shore { fill: none; stroke: var(--shore); stroke-width: 12; stroke-linejoin: round; }
.mount { fill: var(--mount); }
.river { fill: none; stroke: var(--water-edge); stroke-width: 2.5; stroke-linecap: round; }
.river-label { fill: var(--muted); font-family: var(--font-body); font-size: 11px; font-style: italic; }
.olkhon { fill: var(--land); stroke: var(--water-edge); stroke-width: 1; }
.olkhon-label { fill: var(--muted); font-family: var(--font-body); font-size: 10px; }
.lake-label { fill: var(--water-edge); font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
.lake-sub { fill: var(--muted); font-family: var(--font-body); font-size: 13px; }
.cracks path { fill: none; stroke: var(--ice); stroke-width: 1; opacity: .5; }

.art { position: absolute; z-index: 2; padding: 0; border: 0; background: none; cursor: pointer; display: grid; gap: 4px; justify-items: center; text-align: center; color: var(--fg); font-family: var(--font-body); }
.art svg { display: block; width: 100%; height: auto; transition: transform .3s; }
.art:hover svg, .art:focus-visible svg { transform: scale(1.04); }
.art:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; border-radius: 12px; }
.art strong { font-family: var(--font-display); font-weight: 500; font-size: 15px; line-height: 1.25; }
.art em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--accent); }
.ring { fill: none; stroke: var(--turq-ring); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: ripple 4s ease-in-out infinite; }
.ring:nth-of-type(2) { animation-delay: -1.3s; } .ring:nth-of-type(3) { animation-delay: -2.6s; }
@keyframes ripple { 50% { transform: scale(1.08); opacity: .55; } }
.photo-wrap { aspect-ratio: 3 / 2; max-width: 100%; background: var(--band); border-radius: 15px 15px 0 0; overflow: hidden; }
.photo { display: block; width: 100%; height: 100%; object-fit: cover; transition: opacity .25s; }
.photo.loading { opacity: 0; }

.stop {
  position: absolute; z-index: 2; width: 36px; height: 36px; padding: 0;
  transform: translate(-50%, -50%); border-radius: 50%;
  background: var(--bg); border: 3px solid var(--dash); color: var(--fg);
  font: 700 13px/1 var(--font-display); cursor: pointer;
  transition: background .25s, border-color .25s, color .25s;
}
.stop.reached { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.stop:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.card {
  position: absolute; top: 50%; left: calc(100% + 14px); transform: translateY(-50%);
  width: var(--cw, 240px); text-align: left; display: grid; gap: 2px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  font-family: var(--font-body); color: var(--fg); transition: border-color .2s;
}
.stop.on-right .card { left: auto; right: calc(100% + 14px); }
.stop:hover .card, .stop:focus-visible .card { border-color: var(--accent); }
.card small { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.card strong { font-family: var(--font-display); font-weight: 500; font-size: 15px; line-height: 1.25; }
.card em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--accent); }

.car { position: absolute; left: 0; top: 0; width: 30px; height: 52px; margin: -26px 0 0 -15px; z-index: 3; pointer-events: none; transform-origin: 50% 50%; will-change: transform; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }

.start-label { position: absolute; z-index: 2; top: -4px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.start-label b { color: var(--fg); font-family: var(--font-display); font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 15px; margin-left: 6px; }
.finish { max-width: 640px; margin: 0 auto; padding-block: 8px 80px; text-align: center; }
.finish h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 5vw, 36px); margin: 0 0 8px; }
.finish p { color: var(--muted); margin: 0; }

dialog {
  width: min(660px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0;
  border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--fg);
}
dialog::backdrop { background: rgba(8, 18, 16, .55); }
.dlg { padding: 28px 24px 24px; display: grid; gap: 14px; }
.dlg h3 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance; }
.dlg p { margin: 0; }
.dlg .place { color: var(--muted); font-size: 14px; }
.dlg .text { display: grid; gap: 12px; max-width: 65ch; text-wrap: pretty; }
dialog { overflow-y: auto; overscroll-behavior: contain; }
.dlg .close { position: sticky; bottom: 0; }
.close { justify-self: end; border: 0; border-radius: 999px; padding: 10px 18px; background: var(--accent); color: var(--on-accent); font: 700 14px var(--font-body); cursor: pointer; }
.close:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) { .hint span, .ring { animation: none; } }
</style>

<header class="hero">
  <p class="eyebrow">Учебный проект</p>

<script>
// Остановки маршрута по порядку. Чтобы добавить информацию, поменяйте поля title, place и text.
const TBD = "Подробное описание появится позже.";
const STOPS = [
  { title: "Васюганские болота", place: "Томская область", img: "swamp.jpg", art: "swamp", text: `Васюганские болота — одни из самых больших болот в мире. Они расположены в Западной Сибири, в междуречье Оби и Иртыша, на территории Васюганской равнины, находящейся большей частью в пределах Томской области, и малыми частями — Новосибирской, Омской областей, Ханты-Мансийского автономного округа — Югры и севера Тюменской области. С 2007 года Васюганские болота являются кандидатом на включение в список Всемирного наследия ЮНЕСКО. Площадь болот — 53 тыс. км². Васюганские болота возникли около 10 тысяч лет назад и с тех пор постоянно увеличиваются — 75 % их современной площади заболочено за последние 500 лет.

Васюганские болота — дом для многочисленной местной фауны, в том числе редкой. На болотах обитают, в частности, северный олень, беркут, орлан-белохвост, скопа, серый сорокопут, сапсан. В значительных количествах имеются белки, лоси, соболя, глухари, белые куропатки, рябчики, тетерева, в меньших количествах — норка, выдра, росомаха. Флора также включает в себя редкие и исчезающие виды растений и растительные сообщества. Из дикоросов широко распространены клюква, голубика, морошка.

Болота содержат огромные запасы торфа и противодействуют парниковому эффекту, связывая углерод. Разведанные запасы торфа составляют более 1 млрд тонн, средняя глубина залегания — 2,4 м, максимальная — 10 м.

Для жителей этой местности Васюганские болота являются одним из источников пищи. Летом и осенью болота дают щедрый урожай морошки, клюквы, брусники и голубики, сбор которых для многих семей является подспорьем или работой. В бесчисленных озёрах и топях добывают рыбу, а в тайге вокруг — лосей, соболей, глухарей и дичь. Недра содержат миллиарды тонн торфа и крупные запасы углеводородов (нефть и газ).

Также для местных болото — живое существо. Местные верят в болотных духов и «блудные места», где можно ходить кругами по одному гектару три дня. На болотах не принято шуметь, сквернословить или оставлять мусор, чтобы «болото не осерчало» и не затянуло в трясину.` },
  { title: "Кузнецкий Алатау", place: "Кемеровская область — Кузбасс", img: "alatau.jpg", art: "alatau", text: `Кузнецкий Алатау — это горная система на юге Сибири, расположенная преимущественно на территории Кемеровской области — Кузбасса. Она представляет собой протяжённую область горных хребтов, покрытых тайгой, с высокогорными лугами, каменистыми вершинами, водопадами и многочисленными реками. Название «Алатау» в тюркских языках связано с пёстрыми, разноцветными горами, что отражает особенности горных ландшафтов.

В 1989 году здесь был создан государственный природный заповедник «Кузнецкий Алатау». Его главная задача — сохранение природных комплексов горной тайги, редких видов растений и животных, а также водных ресурсов. Территория имеет особое значение для Кузбасса, где развиты угледобывающая промышленность и металлургия: заповедник сохраняет участки природы, практически не затронутые хозяйственной деятельностью.

Для Кузнецкого Алатау характерна высотная поясность: в нижних частях гор преобладают леса, выше располагаются субальпийские и альпийские луга, а на наиболее высоких участках встречаются горная тундра и каменистые россыпи. Горные реки и ручьи питаются осадками и талыми водами, поэтому местные экосистемы играют важную роль в формировании речного стока. Здесь обитают бурые медведи, лоси, маралы и другие представители сибирской фауны.

Кузнецкий Алатау имеет значение не только для охраны природы, но и для науки и экологического туризма. Его территория позволяет изучать горные экосистемы и влияние природных условий на биоразнообразие. При этом посещение заповедника ограничено природоохранным режимом: туристические маршруты проходят только по разрешённым участкам.` },
  { title: "Шерегеш", place: "Кемеровская область, Горная Шория", img: "sheregesh.jpg", art: "sheregesh", text: `Шерегеш — это горнолыжный курорт на юге Кемеровской области, в Горной Шории, расположенный у подножия горы Зелёной. Он известен продолжительным горнолыжным сезоном, обильными снегопадами, лесными склонами и развитой туристической инфраструктурой. Курорт стал одним из главных центров зимнего отдыха в Сибири и важной достопримечательностью Кузбасса.

История Шерегеша связана не только с туризмом, но и с промышленным освоением региона. В начале XX века братья Шерегешевы открыли здесь железорудное месторождение, благодаря которому возник посёлок. В 1980 году на горе Зелёной начали готовить горнолыжные трассы к XVII Спартакиаде народов РСФСР, проходившей зимой 1981 года. Постепенно спортивная площадка превратилась в крупный курорт.

Шерегеш имеет большое экономическое значение для региона: туризм обеспечивает рабочие места, привлекает посетителей и способствует развитию сферы услуг. При этом растущий туристический поток увеличивает нагрузку на горные экосистемы и инфраструктуру, поэтому для дальнейшего развития курорта важно сочетать строительство новых объектов с охраной окружающей среды.` },
  { title: "Озеро Бурсоль", place: "Алтайский край, Кулундинская степь", img: "bursol-pink-train.jpg", art: "bursol", text: `Бурлинское озеро — это бессточное солёное озеро с розовой водой и действующим солепромыслом. Озеро расположено в Кулундинской степи в 40 км от города-курорта Яровое. Бурсоль — самое крупное месторождение соли в Западной Сибири, известное ещё с царских времён. Берега озера представляют собой соляную корку, на которой не может выжить ни одно растение. Поэтому на подходе к водоёму складывается впечатление, что вокруг белая пустыня, отчего цвет воды кажется ещё более насыщенным.

Также по озеру ходит поезд — уникальный соледобывающий состав на Алтае, который ходит по рельсам, уложенным прямо по мелководному дну водоёма. Со стороны кажется, что он движется прямо по розовой воде, из-за чего его называют «поездом-амфибией». Роль локомотива выполняет обычный трактор, поставленный на железнодорожную платформу. Он тянет за собой вагонетки и специальный комбайн. Комбайн фрезами разрыхляет пласт на дне, очищает соль от озёрной воды и сразу грузит её в вагоны. Подводные рельсы регулярно сдвигают на новые участки. Старые места оставляют «отдыхать» на 8 лет, за которые природа полностью восстанавливает соляной слой.

Для местных жителей озеро Бурсоль — не просто место работы. В духовном плане озеро воспринимается как живой, меняющий цвет организм, который веками кормит, защищает и определяет идентичность всего поселения: местная культура глубоко укоренена в гордости за статус исторической «царской солонки» России, а невероятные розовые пейзажи дарят людям чувство глубокой связи с природой. В то же время это духовное почтение неразрывно связано с тяжёлым соляным трудом: на протяжении 250 лет судьба почти каждой семьи здесь завязана на солепромысел, где добыча соли является передаваемым из поколения в поколение ремеслом, дающим посёлку смысл существования, экономическую опору и сплочённость.` },
  { title: "Алтайские горы", place: "Республика Алтай", img: "altai.jpg", art: "altai", text: `Алтайские горы — это обширная горная система на юге Сибири, в районе пересечения границ России, Казахстана, Монголии и Китая. Российская часть Алтая отличается разнообразием ландшафтов: здесь расположены высокие горные хребты, ледники, глубокие речные долины, хвойные леса, степи и высокогорные озёра. Среди наиболее известных природных достопримечательностей — гора Белуха, Телецкое озеро и долины рек Чуи и Катуни.

Для Алтая характерна высотная поясность: с увеличением высоты меняются температура, растительность и животный мир. В предгорьях распространены степи и лесостепи, выше располагаются хвойные леса, субальпийские и альпийские луга, а на наиболее высоких участках — скалы и ледники. Горные ледники и осадки питают многочисленные реки, поэтому Алтай играет важную роль в формировании водных ресурсов Сибири. Здесь встречаются редкие животные, в том числе снежный барс и сибирский горный козёл.

В 1998 году территория под названием «Золотые горы Алтая» была включена в Список всемирного наследия ЮНЕСКО. В этот объект входят несколько особо ценных природных участков, в том числе Алтайский и Катунский заповедники и плоскогорье Укок. Международное признание связано с уникальным биоразнообразием, сохранностью природных комплексов и значением территории для охраны редких видов. При этом статус всемирного наследия распространяется на определённые участки, а не на все Алтайские горы целиком.

Алтай имеет и большое культурное значение. Здесь живут коренные народы, в том числе алтайцы, чьи традиции, фольклор и представления о мире исторически связаны с горами, реками и степями. Для местных сообществ некоторые природные объекты имеют не только хозяйственное, но и духовное значение. Сегодня регион привлекает туристов пешими маршрутами, горными походами, поездками по Чуйскому тракту и отдыхом у Телецкого озера. Однако массовый туризм может приводить к загрязнению территории и повреждению природных комплексов, поэтому важно соблюдать правила особо охраняемых природных территорий и уважать местные традиции.` },
  { title: "Гейзерное озеро", place: "Республика Алтай, Улаганский район", img: "geyser.jpg", art: "geyser", text: `Гейзерное озеро — уникальный природный водоём в Улаганском районе Республики Алтай. Расположено около 6 км от села Акташ (примерно в 1 км от Чуйского тракта), у подножья Северо-Чуйского хребта. Максимальная глубина составляет около 2 метров, диаметр — примерно 30 метров. Вода чистая, прозрачная и никогда не замерзает зимой из-за подземных источников.

Настоящих вулканических гейзеров на дне нет. Озеро питают подземные родники, которые поднимают со дна смесь голубой глины и песка, создавая на поверхности красивые и постоянно меняющиеся круговые узоры. Учёные до сих пор точно не знают, когда именно и как образовалось это озеро. Местные жители утверждают, что водоём появился относительно недавно — его открыли только в начале XXI века (примерно в 2003 году) после сильного Чуйского землетрясения, которое могло открыть подземные источники.

Обращаясь к значению этого природного объекта для сибиряков, можно сказать, что это озеро — точка, через которую Земля смотрит на мир и считывает помыслы людей, а меняющиеся узоры бирюзовой глины на дне считаются знаками, способными дать ответы человеку с чистым сердцем.

Из-за священного статуса водоёма вокруг него существуют строгие правила: здесь категорически запрещено купаться, шуметь и бросать что-либо в воду, так как это считается осквернением духа — хозяина озера. Из-за массового наплыва туристов, разрушающих хрупкую экосистему, старейшины и местные организации активно борются за присвоение озеру официального статуса памятника природы, чтобы защитить свою святыню от уничтожения.` },
  { title: "Марс 1 и Марс 2", place: "Республика Алтай, Кош-Агачский район", img: "mars.jpg", art: "mars", text: `В таинственном уголке Кош-Агачского района Республики Алтай (864-й км Чуйского тракта) находится «земной Марс». Это уникальные цветные горы, которые уже давно имеют свои космические имена: «Марс-1» и «Марс-2». Расположены эти фантастические пейзажи совсем недалеко от автодороги (около 7 км), в объятиях долин речек Кызыл-Чин и Чаган-Узун, возле посёлка Ортолык и крошечного села Бельтир. Личный Марс землян на Алтае — не просто чудо природы, это горный артефакт, возвышающийся на 1800 м (на некоторых участках — почти до 2 км) над уровнем моря.

Урочище Кызыл-Чин привлекает не только своим необычным названием, но и разнообразием природы. Переведённое с тюркского название означает «красное ущелье», и не просто так. Когда вы поднимаетесь к вершинам, освещённым закатными лучами, красный оттенок гор и ущелий создаёт ощущение, будто горы горят. В июне-июле, когда кустарники насыщаются яркими красками, это место преображается в настоящий пейзаж сказочного мира. Здесь совершенно уникальный альпийский микроклимат, привлекающий туристов. Апрель и май привносят свою особенность — в эти месяцы в долине свободно пасутся стада домашних коз и овец, придавая урочищу атмосферу древности и спокойствия.

История происхождения алтайского Марса уходит своими корнями в прошлое. Учёные связывают его с доисторическим морем, которое существовало на этих землях 90 млн лет назад. Алтайский Марс, как дно этого моря, до сих пор хранит следы древних времён. Аммониты (окаменелые ракушки) являются свидетельством этого периода. Многообразие жёлто-красных оттенков природы объясняется наличием различных горных пород, выходящих наружу. Окрашенная в красный глина, строматолитовые известняки и алевриты, а также гравий с песком и щебнем создают удивительные слоистые картины. Каждый из этих слоёв имеет толщину от 30 см до 5 м, раскрывая перед глазами путешественников богатство геологической истории этого необычного места.

Алтайская марсианская долина — край, где есть и флора, и фауна, в отличие от безжизненной одноимённой планеты и её фантастических пейзажей. Сочетание космической атмосферы с островками растительности выглядит необычно. Скудные пустынные центральноазиатские растения играют свою роль в этом приключении. Между яркими желтовато-красными пригорками притаилась отличающаяся своей неприхотливостью карагана Бунге — гладкоствольная разновидность кустарника. Она придаёт этим местам особый, экзотический вид. Цветущая курчавка колючая и остролодочник растут на растрескавшейся почве с включением глины и камней, создавая волшебное зрелище. Небольшие участки огненной анкафии и душистой полыни добавляют красок в пустынный ландшафт. Некоторые животные находят свой дом в этих краях. Например, филины, грифы и удоды — пернатые представители края. Также можно увидеть на пастбищах баранов и диких коз.

Местные жители села Чаган-Узун и окрестностей зарабатывают на приёме гостей: организуют заброски на внедорожниках и УАЗиках по сложной дороге к «Марсу-1», сдают жильё, открывают глэмпинги и кафе. В сезон местные жители продают туристам изделия ручной работы, травяные чаи, мёд и блюда национальной кухни.

Для местных жителей никаких названий вроде «Марс» до недавнего времени не существовало. Коренное население связывает эти холмы со своим родным языком: Кызыл-Чин переводится как «Красное ущелье» или «Красный ров». Инопланетное имя локации дали в конце XX века приехавшие на практику студенты-геологи, но старожилы по-прежнему воспринимают эту землю через её историческое тюркское название.

Как и к любой горе на Алтае, к вершинам Кызыл-Чина коренное население относится с духовным благоговением. Алтайцы верят, что у каждого ущелья и перевала есть свой дух-хозяин (ээзи), требующий уважительного отношения. Шумное поведение, мусор и разрушение хрупких глиняных стен туристами воспринимаются местными как осквернение их священного пространства. Кроме того, неподалёку в Чаган-Узуне находится почитаемый местными целебный «святой ключ» (аржан), с которым связывают легенды об исцелении.` },
  { title: "Каменные грибы", place: "Республика Алтай, урочище Ак-Курум", img: "mushrooms.jpg", art: "mushrooms", text: `Каменные грибы — это уникальные геологические останцы, расположенные в урочище Ак-Курум (в переводе с алтайского — «Белая осыпь») на правом берегу реки Чулышман в Улаганском районе Республики Алтай. Природный памятник находится неподалёку от места впадения реки Чульчи в Чулышман и ущелья Карасу.

Необычные скальные образования сформировались в результате многовековых процессов водной эрозии и выветривания. «Шляпки» этих структур состоят из более прочных, плотных пород (плит песчаника или сланца), а «ножки» — из рыхлых конгломератов, включающих мелкие камни, глину и песок. Поскольку плотные плиты защищают подстилающие слои от вымывания дождями и разрушения ветром, вокруг них со временем сформировались характерные высокие столбы.

Высота каменных грибов варьируется от 1 до 7 метров, а диаметр «ножек» у отдельных экземпляров составляет от 0,5 до 2,5 метров. Останцы продолжают медленно меняться и разрушаться под воздействием эрозии, из-за чего форма «шляпок» и толщина «ножек» постоянно претерпевают изменения.

Чтобы добраться до урочища, туристам необходимо переправиться на лодке через реку Чулышман и совершить пеший подъём по крутой горной тропе на высоту около 120 метров над уровнем реки.` },
  { title: "Саяно-Шушенская ГЭС", place: "Республика Хакасия, река Енисей", img: "ges.jpg", art: "ges", text: `Саяно-Шушенская гидроэлектростанция имени П. С. Непорожнего — самая мощная электростанция и крупнейшая ГЭС в России, расположенная на реке Енисей в Хакасии, возле посёлка Черёмушки (недалеко от Саяногорска). Станция является верхней ступенью Енисейского каскада ГЭС и установлена в так называемом Саянском коридоре, где река прорезает горные хребты Западного Саяна.

Главная особенность гидроузла — уникальная арочно-гравитационная бетонная плотина высотой 242 (по некоторым данным — до 245) метра. Она считается самой высокой плотиной в России и одной из высочайших в мире. Длина плотины по гребню составляет 1066 метров, ширина основания — около 105,7 метра, а на её возведение ушло более 9 млн кубометров бетона.

Подготовительные работы и строительство инфраструктуры начались в 1963 году, а осенью 1975 года Енисей был перекрыт. Первый гидроагрегат станции начал вырабатывать промышленный ток в конце 1978 года, последний (десятый) ввели в строй в 1985 году, а официальный приём комплекса в постоянную эксплуатацию состоялся в 2000 году. Установленная электрическая мощность ГЭС составляет 6400 МВт, а среднегодовая выработка электроэнергии достигает 23,5–24 млрд кВт·ч. Плотина сдерживает огромное Саяно-Шушенское водохранилище объёмом свыше 31 млрд кубических метров и площадью зеркала около 621 кв. км.

Для повышения безопасности и сброса паводковых вод помимо основного водосброса у станции был сооружён береговой туннельный водосброс, способный пропускать мощные потоки воды со скоростью до 5000 м³/с. В 2020 году на плотине ГЭС создали самое большое в России граффити — надпись «РОССИЯ» длиною полкилометра, для которой потребовалось около 9 тысяч литров краски. Сегодня гидроэлектростанция привлекает туристов потрясающим контрастом гигантского рукотворного сооружения и суровой горной природы Саян, а со смотровых площадок открывается вид на плотину и машинный зал.` },
  { title: "Парк Ергаки", place: "Красноярский край, Западный Саян", img: "ergaki.jpg", art: "ergaki", text: `Ергаки — природный парк краевого значения, расположенный на юге Красноярского края. Как особо охраняемая природная территория природный парк был организован 4 апреля 2005 года. Площадь — 342 873 га. Это туристский центр хребта Ергаки в Западном Саяне. Парк расположен в истоках рек Большой Кебеж, Большой Ключ, Тайгиш, Верхняя Буйба, Средняя Буйба и Нижняя Буйба. Входит в состав ассоциации заповедников и национальных парков Алтае-Саянского экорегиона.

Парк представляет собой массив разнонаправленных грив и отрогов, в значительной степени обработанных ледником. Горный рельеф в центральной части природного парка на периферии сменяется гольцовым с отдельно расположенными горами и отрогами более плавных очертаний с пенепленом на вершинах. Отдельные горные пики имеют причудливые очертания и собственные имена: Звёздный, Зуб Дракона, Птица, Парабола, Молодёжный, Зеркальный, Верблюд, Тугодум и др.

Неповторимость парку Ергаки придают множество озёр, как правило карстовых, ледникового происхождения. Наиболее известны: Буйбинские озёра (Радужное, Каровое, Светлое), Тушканчик (Мраморное), Золотарное (Малахитовое), Горных Духов. Наиболее крупные озёра — Большое Буйбинское, Большое Безрыбное и Большое (Светлое). Символ парка — логотип с изображением кабарги на фоне горных вершин.

На территории природного парка произрастает свыше 700 видов растений, грибов, мхов и лишайников. Только в данном регионе произрастают такие растения, как ястребиночка кебежская, борец Черепнина, борец танзыбейский и борец буйбинский. В природном парке обитает 49 видов млекопитающих. Широко распространены заяц-беляк, рысь, северный олень, бобр, белка, бурундук и др. В Приложение к Красной книге Красноярского края включено 6 видов млекопитающих, обитающих на территории парка: выдра речная, рысь обыкновенная, кабан сибирский, кабарга, марал, лось. На территории гнездятся 163 вида птиц.

Для коренных народов Саяно-Алтайского региона (особенно тувинцев и хакасов) Ергаки — священная земля. Само название хребта происходит от древнетюркского «эргек» — пальцы. По легенде, это каменные пальцы Земли, которые удерживают небо. Известный скальный силуэт, напоминающий лежащего богатыря со скрещёнными руками, местные почитают как вечного хранителя тайги от злых духов. Согласно поверьям, если Висячий камень (огромная каменная глыба, балансирующая над обрывом) упадёт в озеро Радужное, Спящий Саян проснётся и наступит новая эпоха. Тувинские шаманы до сих пор относятся к этим горам как к мощнейшему энергетическому центру, где проводят обряды и просят защиты у духов природы. Также Ергаки — любимая «дача» на выходные, где местные могут сбежать от городской суеты и подышать чистым таёжным воздухом.

Для жителей Ермаковского района Ергаки — это ключевой источник дохода. Развитие туризма создало целую экосистему рабочих мест. Местные мужчины работают гидами, проводниками и «шерпами» (портерами). Они прекрасно знают тайгу, тропы, повадки медведей и помогают туристам забрасывать тяжёлые рюкзаки к лагерям. Кроме этого, местные строят базы отдыха, сдают дома в аренду, водят экскурсии, держат кафе у трассы Р-257 и продают туристам локальные сувениры, мёд и таёжные чаи.

В отличие от строгих заповедников, статус «природного парка» позволяет местным жителям использовать ресурсы тайги. В парке выделена специальная хозяйственная зона, где жителям Ермаковского и близлежащих районов официально разрешено: собирать кедровый орех, черемшу, чернику и бруснику для себя, заготавливать лекарственные таёжные травы (например, знаменитый саган-дайля или золотой корень), заниматься любительским рыболовством и охотой (по строгим квотам и согласованию с дирекцией).` },
  { title: "Красноярские Столбы", place: "Красноярский край, Красноярск", img: "stolby-perya.jpg", art: "stolby", text: `«Красноярские Столбы» — национальный парк общей площадью более 47 тысяч гектаров, расположенный на северо-западных отрогах Восточного Саяна. Уникальная природная территория вплотную примыкает к южной и юго-западной границе города Красноярска, являясь излюбленным местом для активного отдыха, туризма и скалолазания.

Главной достопримечательностью парка являются величественные скалы-останцы вулканического происхождения, возраст которых оценивается примерно в 9–10 миллионов лет. Высота некоторых каменных гигантов достигает 90–100 метров, а причудливые очертания подарили им такие знаменитые имена, как Первый Столб, Второй Столб, Перья, Дед, Львиные ворота и Такмак.

История охраны этих мест началась по инициативе местных жителей ещё 30 июня 1925 года, когда территория получила официальный статус заповедника для спасения уникальных ландшафтов от вырубки и добычи камня. В 2019 году объект был преобразован в национальный парк. За более чем полуторавековую историю посещения скал здесь зародился уникальный культурно-спортивный феномен — «столбизм», объединивший поколения энтузиастов свободного лазания по отвесным стенам без страховки. Флора парка насчитывает более 850 видов высших растений, а тайга и скальные районы служат домом для сотен видов животных и птиц.` },
  { title: "Озеро Байкал", place: "Иркутская область и Республика Бурятия", img: "baikal-shamanka.jpg", text: `Байкал — озеро тектонического происхождения на юге Восточной Сибири, на границе Иркутской области и Бурятии. Это самое глубокое озеро на Земле (1642 м, средняя глубина около 744 м) и крупнейший природный резервуар пресной воды: около 23,6 тыс. км³, это примерно 19% мировых запасов озёрной пресной воды. Озеро тянется полумесяцем на 636 км, его площадь около 31,7 тыс. км², что сравнимо с Бельгией. В Байкал впадают сотни рек, а вытекает только одна — Ангара.

Вода очень чистая и прозрачная, камни видно на глубине до 40 м. Чистоту во многом поддерживает крошечный рачок эпишура, который фильтрует воду. Даже летом поверхность прогревается лишь до +8–9 °C. Зимой озеро почти целиком замерзает, лёд достигает метровой толщины и трескается с грохотом, похожим на выстрелы. В озере около 2600 видов животных и растений, примерно две трети из них эндемики, то есть встречаются только здесь. Среди известных обитателей — байкальский омуль, живородящая рыба голомянка и байкальская нерпа. На большой глубине здесь растут даже пресноводные губки.

С 1996 г. Байкал входит в список Всемирного наследия ЮНЕСКО, в 1999 г. принят закон о его охране. Главные угрозы — загрязнение через Селенгу (в том числе с территории Монголии), бывший Байкальский целлюлозно-бумажный комбинат (закрыт в 2013 г.), колебания уровня воды из-за Иркутской ГЭС, браконьерство и разрастание нитчатых водорослей у берегов из-за неочищенных стоков.

Байкал для коренных народов (бурят и эвенков) имеет значение святыни — они относятся к нему не как к водоёму, а как к живому божеству, грозному владыке и Священному морю. Местные жители уважительно относятся к Байкалу, веря, что озеро обладает душой, способно слышать человека и карать за непочтение. Прибайкалье и особенно остров Ольхон официально признаны главным сакральным центром шаманизма в Северной Азии — это некая земная резиденция озера, где веками проводятся главные обряды и общение с духами предков.

Священный статус Байкала накладывает на местных жителей строжайшие запреты: здесь категорически запрещено загрязнять воду, проявлять негативные эмоции и бездумно уничтожать природу. Приходя к берегу, коренные жители обязательно проводят обряд «капания» — подносят духам молоко или чай, прося разрешения войти в их владения. Озеро воспринимается как источник энергии и исцеления, а сохранение его первозданной чистоты для местных является вопросом духовного выживания региона.` },

    <path d="M18 92 L24 70 L30 92 Z M276 104 L283 80 L290 104 Z M262 100 L267 84 L272 100 Z" fill="var(--pine)"/>
  </svg>`,
  mars: `<svg viewBox="0 0 300 150" aria-hidden="true">
    <path d="M0 140 Q30 76 80 82 Q120 36 176 66 Q226 42 300 96 L300 140 Z" fill="var(--mars-light)"/>
    <path d="M0 140 Q36 96 82 100 Q124 66 176 88 Q228 70 300 112 L300 140 Z" fill="var(--mars)"/>
    <path d="M0 140 Q40 114 86 118 Q130 94 180 108 Q232 96 300 126 L300 140 Z" fill="var(--mars-dark)"/>
    <path d="M30 124 Q90 108 150 116 T280 118" fill="none" stroke="var(--salt)" stroke-width="2" opacity=".55"/>
    <ellipse cx="150" cy="142" rx="150" ry="6" fill="var(--rock)" opacity=".5"/>
  </svg>`,
  ergaki: `<svg viewBox="0 0 300 150" aria-hidden="true">
    <path d="M0 104 L28 62 L44 76 L70 30 L84 56 L100 40 L124 74 L150 20 L162 44 L178 32 L202 70 L230 36 L250 62 L272 48 L300 92 L300 112 L0 112 Z" fill="var(--rock-dark)"/>
    <path d="M70 30 L78 44 L70 41 L64 44 Z M150 20 L158 34 L150 31 L143 35 Z M230 36 L238 50 L230 47 L224 50 Z M178 32 L184 42 L176 40 Z" fill="var(--snow)"/>
    <path d="M0 112 Q80 96 150 108 T300 104 L300 150 L0 150 Z" fill="var(--meadow)"/>
    <ellipse cx="150" cy="128" rx="90" ry="14" fill="var(--water)"/>
    <path d="M14 136 L24 104 L34 136 Z M36 138 L44 114 L52 138 Z M254 136 L264 102 L274 136 Z M274 138 L283 112 L292 138 Z" fill="var(--pine)"/>
  </svg>`,
};

function build() {
  const W = road.clientWidth;
  const spacing = W < 560 ? 300 : 360, top = 150;
  const n = STOPS.length;
  // Байкал: вытянутый серп с северо-востока на юго-запад, дорога приходит к его северной оконечности
  const LX = W * 0.08, LW = W * 0.84, LH = Math.min(400, Math.max(260, W * 0.52));
  const tipY = top + (n - 1) * spacing;           // последняя остановка = Байкал
  const LY = tipY - LH * 0.03;
  H = LY + LH + 30;
  road.style.height = H + 'px';
  const L = (u, v) => `${(LX + u * LW).toFixed(1)},${(LY + v * LH).toFixed(1)}`;
  const L0 = u => (LX + u * LW).toFixed(1);
  const P = ([u, v]) => ({ x: LX + u * LW, y: LY + v * LH, v });
  // северо-западный берег (с юга на север), затем юго-восточный (с севера на юг)
  const NW = [[.03,.91],[.10,.86],[.20,.80],[.29,.71],[.37,.61],[.46,.51],[.555,.41],[.65,.31],[.75,.21],[.85,.12],[.92,.055],[.955,.03]];
  const SE = [[.975,.07],[.93,.15],[.85,.245],[.76,.335],[.69,.40],[.655,.455],[.60,.49],[.53,.55],[.46,.62],[.42,.70],[.35,.76],[.25,.84],[.14,.915],[.06,.965],[.02,.95]];
  const outline = NW.concat(SE).map(P);
  const lakeD = smoothClosed(outline);
  ['lake', 'lakeShore', 'lakeClipPath'].forEach(id => document.getElementById(id).setAttribute('d', lakeD));
  document.getElementById('olkhon').setAttribute('d', smoothClosed(
    [[.478,.565],[.50,.53],[.528,.49],[.548,.462],[.556,.458],[.545,.485],[.52,.525],[.494,.565]].map(P)));
  // нерпа выныривает посреди озера
  const nk = Math.max(.6, LW * .1 / 60);
  document.getElementById('nerpa').setAttribute('transform', `translate(${L0(.625)} ${(LY + LH * .40).toFixed(1)}) scale(${(nk * .85).toFixed(2)})`);
  const lab = document.getElementById('lakeLabel'), sub = document.getElementById('lakeSub'), dep = document.getElementById('lakeDepth');
  [lab, sub, dep].forEach(t => t.setAttribute('x', L0(.73)));
  lab.setAttribute('y', LY + LH * .64); sub.setAttribute('y', LY + LH * .62 + 22); dep.setAttribute('y', LY + LH * .62 + 40);

  const pts = [{ x: W / 2, y: 0 }];
  STOPS.forEach((_, i) => pts.push(i === n - 1
    ? { x: LX + LW * .955, y: tipY }
    : { x: W * (i % 2 ? 0.76 : 0.24), y: top + i * spacing }));

  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], h = (b.y - a.y) / 2;
    d += ` C${a.x},${a.y + h} ${b.x},${b.y - h} ${b.x},${b.y}`;
  }
  band.setAttribute('d', d);
  dash.setAttribute('d', d);

  // таблица длина → точка, чтобы быстро двигать машину
  const total = dash.getTotalLength();
  table = [];
  for (let i = 0; i <= 600; i++) { const p = dash.getPointAtLength(total * i / 600); table.push({ x: p.x, y: p.y }); }

  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

  // трещины во льду Байкала
  let c = '';
  for (let k = 0; k < 16; k++) {
    const x1 = LX + rnd() * LW, y1 = LY + rnd() * LH, x2 = x1 + (rnd() - .5) * LW * .45, y2 = y1 + (rnd() - .5) * LH * .7;
    c += `<path d="M${x1},${y1} Q${(x1 + x2) / 2 + (rnd() - .5) * 40},${(y1 + y2) / 2} ${x2},${y2}"/>`;
  }
  document.getElementById('cracks').innerHTML = c;

  // хребты вдоль берегов Байкала
  let m = '';
  for (let k = 0; k < outline.length - 1; k++) {
    const a = outline[k], b = outline[k + 1];
    if (Math.min(a.v, b.v) < .22 || Math.max(a.v, b.v) > .88) continue;
    if (k >= NW.length && a.v > .45) continue;  // место для подписи и устья Селенги
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy), nx = dy / len, ny = -dx / len;
    const steps = Math.max(1, Math.floor(len / 20));
    for (let s2 = 0; s2 < steps; s2++) {
      const t = (s2 + .5) / steps, off = 16 + rnd() * 10, h = 8 + rnd() * 9;
      const px = a.x + dx * t + nx * off, py = a.y + dy * t + ny * off;
      m += `<path d="M${px - h * .8},${py + h * .35} L${px},${py - h * .7} L${px + h * .8},${py + h * .35} Z"/>`;
    }
  }
  document.getElementById('mounts').innerHTML = m;

  stopEls.concat(artEls).forEach(el => el.remove());
  artEls = [];
  const cw = Math.min(260, W / 2 - 40);
  const artW = Math.min(300, W * 0.76 - 70);
  stopYs = [];
  const st = document.createElement('div');
  st.className = 'start-label';
  st.style.left = (W / 2 + 34) + 'px';
  st.innerHTML = 'Старт<b>Новосибирск</b>';
  road.appendChild(st);
  artEls.push(st);
  stopEls = STOPS.map((s, i) => {
    const p = pts[i + 1];
    stopYs.push(p.y);
    const b = document.createElement('button');
    b.className = 'stop' + (p.x > W / 2 ? ' on-right' : '');
    b.style.left = p.x + 'px';
    b.style.top = p.y + 'px';
    b.style.setProperty('--cw', cw + 'px');
    b.setAttribute('aria-label', `Остановка ${i + 1}: ${s.title}`);
    b.addEventListener('click', () => openStop(i));
    const more = s.text !== TBD ? 'Подробнее →' : 'Описание скоро появится';
    if (s.art && ART[s.art]) {
      // рисунок внутри изгиба дороги: машина объезжает его
      b.textContent = i + 1;
      const a = document.createElement('button');
      a.className = 'art';
      a.style.width = artW + 'px';
      a.style.left = (p.x > W / 2 ? p.x - 66 - artW : p.x + 66) + 'px';
      a.style.top = (p.y - artW / 4) + 'px';
      a.innerHTML = ART[s.art] + `<strong></strong><em>${more}</em>`;
      a.querySelector('strong').textContent = s.title;
      a.setAttribute('aria-label', `Остановка ${i + 1}: ${s.title}`);
      a.addEventListener('click', () => openStop(i));
      road.appendChild(a);
      artEls.push(a);
    } else {
      b.innerHTML = `${i + 1}<span class="card"><small>Остановка ${i + 1}</small><strong></strong><em>${more}</em></span>`;
      b.querySelector('strong').textContent = s.title;
    }
    road.appendChild(b);
    return b;
  });
  // лес: деревья растут группами с полянами, в обход дороги, подписей и Байкала
  const rr = road.getBoundingClientRect();
  const boxes = [...road.querySelectorAll('.card, .art, .start-label')].concat(['lakeLabel', 'lakeSub', 'lakeDepth'].map(id => document.getElementById(id)))
    .map(e => { const r = e.getBoundingClientRect(); return { l: r.left - rr.left - 12, r: r.right - rr.left + 12, t: r.top - rr.top - 20, b: r.bottom - rr.top + 8 }; });
  const segD = (x, y, a, b) => { const dx = b.x - a.x, dy = b.y - a.y, t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy))); return Math.hypot(x - a.x - t * dx, y - a.y - t * dy); };
  const inLake = (x, y) => {
    let c = false;
    for (let i = 0, j = outline.length - 1; i < outline.length; j = i++) {
      const a = outline[i], b = outline[j];
      if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) c = !c;
      if (segD(x, y, a, b) < 50) return true;
    }
    return c;
  };
  const nearRoad = (x, y) => {
    let lo = 0, hi = table.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (table[m].y < y - 60) lo = m; else hi = m; }
    for (let k = lo; k < table.length && table[k].y < y + 60; k++) if (Math.hypot(table[k].x - x, table[k].y - y) < 40) return true;
    return false;
  };
  const clusters = Array.from({ length: Math.ceil(H / 150) * 2 }, () => ({ x: rnd() * W, y: rnd() * H, r: 60 + rnd() * 110 }));
  let glades = '';
  for (let k = 0; k < H / 140; k++) glades += `<ellipse class="glade" cx="${(rnd() * W).toFixed(0)}" cy="${(rnd() * H).toFixed(0)}" rx="${(40 + rnd() * 90).toFixed(0)}" ry="${(14 + rnd() * 30).toFixed(0)}"/>`;
  const list = [], grid = new Map(), G = 40;
  const key = (cx, cy) => cx + ':' + cy;
  // деревья не должны заходить друг на друга: проверяем соседей по сетке
  const overlaps = (x, y, sz) => {
    const cx = Math.floor(x / G), cy = Math.floor(y / G);
    for (let i = cx - 1; i <= cx + 1; i++) for (let j = cy - 1; j <= cy + 1; j++) {
      for (const t of grid.get(key(i, j)) || []) {
        if (Math.abs(t.x - x) < t.s + sz + 2 && y - sz * 2.4 < t.y + 2 && t.y - t.s * 2.4 < y + 2) return true;
      }
    }
    return false;
  };
  for (let a = 0, N = Math.round(W * H / 400); a < N; a++) {
    const x = rnd() * W, y = 20 + rnd() * (H - 20);
    let dens = Math.min(x, W - x) < 50 ? .85 : 0;
    for (const c of clusters) { const d = Math.hypot(c.x - x, c.y - y); if (d < c.r * 2.2) dens = Math.max(dens, Math.exp(-d * d / (2 * c.r * c.r))); }
    if (rnd() > dens * .95) continue;
    const sz = 6 + rnd() * 7;
    // дерево целиком (крона и ствол) не должно задевать подписи
    if (nearRoad(x, y) || inLake(x, y) || boxes.some(b => x + sz > b.l && x - sz < b.r && y > b.t && y - sz * 2.4 < b.b)) continue;
    if (overlaps(x, y, sz)) continue;
    const tr = { x, y, s: sz, pine: rnd() < .62 };
    list.push(tr);
    const k = key(Math.floor(x / G), Math.floor(y / G));
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(tr);
  }
  list.sort((a, b) => a.y - b.y);
  trees.innerHTML = glades + list.map(({ x, y, s, pine }) => {
    const f = v => v.toFixed(1);
    return pine
      ? `<path class="tree" d="M${f(x)},${f(y - s * 2.3)} L${f(x + s * .7)},${f(y - s * 1)} L${f(x - s * .7)},${f(y - s * 1)} Z M${f(x)},${f(y - s * 1.6)} L${f(x + s)},${f(y)} L${f(x - s)},${f(y)} Z"/>`
      : `<rect class="trunk" x="${f(x - 1)}" y="${f(y - s * .7)}" width="2" height="${f(s * .7)}"/><circle class="tree2" cx="${f(x)}" cy="${f(y - s * 1.2)}" r="${f(s * .8)}"/>`;
  }).join('');
  update(true);
}

// плавный замкнутый контур через точки (Catmull-Rom → кривые Безье)
function smoothClosed(p) {
  const n = p.length, f = v => v.toFixed(1);
  let d = `M${f(p[0].x)},${f(p[0].y)}`;
  for (let i = 0; i < n; i++) {
    const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
    d += ` C${f(p1.x + (p2.x - p0.x) / 6)},${f(p1.y + (p2.y - p0.y) / 6)} ${f(p2.x - (p3.x - p1.x) / 6)},${f(p2.y - (p3.y - p1.y) / 6)} ${f(p2.x)},${f(p2.y)}`;
  }
  return d + ' Z';
}

function pointAtY(y) {
  y = Math.min(y, table[table.length - 1].y);
  let lo = 0, hi = table.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (table[m].y < y) lo = m; else hi = m; }
  const a = table[lo], b = table[hi], t = b.y === a.y ? 0 : (y - a.y) / (b.y - a.y);
  const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI + 90;
  return { x: a.x + (b.x - a.x) * t, y, ang };
}

function update(snap) {
  const r = road.getBoundingClientRect();
  targetY = Math.max(0, Math.min(H, innerHeight * 0.55 - r.top));
  if (snap || reduce) curY = targetY;
}

function frame() {
  curY += (targetY - curY) * 0.15;
  if (Math.abs(targetY - curY) < 0.3) curY = targetY;
  if (table.length) {
    const p = pointAtY(curY);
    car.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.ang}deg)`;
    stopEls.forEach((el, i) => el.classList.toggle('reached', curY >= stopYs[i] - 2));
  }
  requestAnimationFrame(frame);
}

function openStop(i) {
  const s = STOPS[i];
  document.getElementById('infoNum').textContent = `Остановка ${i + 1} из ${STOPS.length}`;
  document.getElementById('infoTitle').textContent = s.title;
  document.getElementById('infoPlace').textContent = s.place;
  const box = document.getElementById('infoText');
  box.replaceChildren(...s.text.split(/\n\s*\n/).map(t => { const p = document.createElement('p'); p.textContent = t.trim(); return p; }));
  const img = document.getElementById('infoImg'), wrap = document.getElementById('photoWrap');
  wrap.hidden = !s.img;
  img.removeAttribute('src');            // убираем прошлое фото сразу
  if (s.img) {
    img.classList.add('loading');
    img.onload = () => img.classList.remove('loading');
    img.alt = s.title;
    img.src = s.img;
    if (img.complete) img.classList.remove('loading');
  }
  dlg.showModal();
  dlg.scrollTop = 0;
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

addEventListener('scroll', () => update(false), { passive: true });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 120); });
build();
// после загрузки шрифтов подписи становятся шире: пересаживаем лес
if (document.fonts) document.fonts.ready.then(build);
requestAnimationFrame(frame);
// заранее подгружаем все фото, чтобы окна открывались быстро
addEventListener('load', () => setTimeout(() => STOPS.forEach(s => { if (s.img) { const i = new Image(); i.src = s.img; } }), 300));
</script>
